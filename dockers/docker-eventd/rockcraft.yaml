# Removed dependencies and why: see sonic-buildimage 202605_resolute_doc docs/superpowers/data/2026-11-11-batch1-deps/REMOVALS-zh.md
name: docker-eventd
summary: SONiC eventd container
description: A Chiselled rock for SONiC eventd container
version: "1.0.0"

base: bare
build-base: ubuntu@26.04
license: Apache-2.0

platforms:
  amd64:

services:
  rsyslogd:
    command: /usr/sbin/rsyslogd -n -iNONE
    override: replace
    startup: enabled
  proc-exit-listener:
    command: /usr/bin/supervisor-proc-exit-listener-rs --pebble
    override: replace
    startup: enabled
    on-success: ignore
    requires: [rsyslogd]
    after: [rsyslogd]
  start:
    command: /usr/bin/start.sh
    override: replace
    startup: enabled
    on-success: ignore
    on-failure: ignore
  eventd:
    command: /usr/bin/eventd
    override: replace
    on-success: ignore
    on-failure: shutdown

parts:
  # INTERIM: Ubuntu slices are cut from jy5275/chisel-releases@sonic-26.04
  # (upstream ubuntu-26.04 + pending PRs) because these slices are not upstream yet:
  #   rsyslog, rsyslog-relp, libestr0, libfastjson4, librelp0  <- canonical/chisel-releases#1104
  # Once ALL PRs above are merged into canonical/chisel-releases ubuntu-26.04:
  #   1. delete this `slices-interim` part
  #   2. uncomment the `ubuntu-slices` part below (same slice list)
  #   3. drop `slices-interim` from any `after:` list
  slices-interim:
    plugin: nil
    source: https://github.com/jy5275/chisel-releases.git
    source-type: git
    source-branch: sonic-26.04
    source-depth: 1
    override-build: |
      chisel cut --release ./ --root ${CRAFT_PART_INSTALL} \
        base-files_base \
        base-files_chisel \
        base-files_release-info \
        base-passwd_data \
        bash_bins \
        coreutils_cat \
        coreutils_echo \
        coreutils_env \
        coreutils_ls-bin \
        coreutils_mkdir \
        coreutils_rm-bin \
        coreutils_touch \
        jq_bins \
        libboost-serialization1.83.0_libs \
        libhiredis1.1.0_libs \
        libnl-nf-3-200_libs \
        libxxhash0_libs \
        libzmq5_libs \
        netbase_config \
        procps_bins \
        rsyslog_bins \
        rsyslog-relp_modules

  # ubuntu-slices:
  #   plugin: nil
  #   stage-slices:
  #     - base-files_base
  #     - base-files_chisel
  #     - base-files_release-info
  #     - base-passwd_data
  #     - bash_bins
  #     - coreutils_cat
  #     - coreutils_echo
  #     - coreutils_env
  #     - coreutils_ls-bin
  #     - coreutils_mkdir
  #     - coreutils_rm-bin
  #     - coreutils_touch
  #     - jq_bins
  #     - libboost-serialization1.83.0_libs
  #     - libhiredis1.1.0_libs
  #     - libnl-nf-3-200_libs
  #     - libxxhash0_libs
  #     - libzmq5_libs
  #     - netbase_config
  #     - procps_bins
  #     - rsyslog_bins
  #     - rsyslog-relp_modules

  sonic-debs:
    plugin: nil
    source: debs
    override-build: |
      dpkg -x libswsscommon_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x sonic-supervisord-utilities-rs_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x libyang3_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x sonic-eventd_*.deb ${CRAFT_PART_INSTALL}
    organize:
      # base-files_var makes /var/run a symlink to /run; libswsscommon ships a real var/run/
      var/run/redis: run/redis
    stage:
      - -var/run
      - -usr/share/doc
      - -usr/share/man
      # Python test tool; the rock has no Python
      - -usr/bin/events_publish_tool.py

  setup-eventd:
    plugin: dump
    source: .
    after: [slices-interim, sonic-debs]
    build-packages:
      - python3-pip
    override-build: |
      craftctl default

      # Build-time only: jinjanator renders the rsyslog plugin confs; it is not staged
      pip install --break-system-packages jinjanator

      # Render rsyslog plugin conf files from j2 templates
      conf_dir=${CRAFT_PART_INSTALL}/etc/rsyslog.d/rsyslog_plugin_conf
      mkdir -p ${conf_dir}
      for ev in host bgp dhcp_relay swss syncd; do
        j2 -f json files/rsyslog_plugin.conf.j2 ${ev}_events_info.json > ${conf_dir}/${ev}_events.conf
      done
    organize:
      critical_processes: etc/supervisor/critical_processes
      start.sh: usr/bin/start.sh
      eventdb_wrapper.sh: usr/bin/eventdb_wrapper.sh
      files/syslog-layer.yaml: usr/share/sonic/templates/syslog-layer.yaml
      files/readiness_probe.sh: usr/bin/readiness_probe.sh
    stage:
      - etc/supervisor/
      - etc/rsyslog.d/
      - usr/
    override-prime: |
      craftctl default

      # Replace the rsyslog_config slice's /etc/rsyslog.conf with SONiC's; done at prime so the slice copy cannot win
      cp ${CRAFT_PROJECT_DIR}/files/rsyslog.conf etc/rsyslog.conf
      cp ${CRAFT_PROJECT_DIR}/manifest.json manifest.json

      # syslog user as in the previous image (uid 999, primary group adm from base-passwd_data)
      groupadd -R ${CRAFT_PRIME} -g 1001 syslog
      useradd -R ${CRAFT_PRIME} -M -r -u 999 -g adm syslog
      rm -f etc/passwd- etc/group- etc/shadow- etc/gshadow- etc/.pwd.lock
