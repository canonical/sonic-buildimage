name: docker-snmp
summary: SONiC snmp container
description: A rock for SONiC snmp container
version: "1.0.0"

base: ubuntu@26.04
build-base: ubuntu@26.04
license: Apache-2.0

platforms:
  amd64:

environment:
  PYTHONOPTIMIZE: "1"

services:
  rsyslogd:
    command: /usr/sbin/rsyslogd -n -iNONE
    override: replace
    startup: enabled
  start:
    command: /usr/bin/start.sh
    override: replace
    startup: enabled
    on-success: ignore
    on-failure: ignore
  snmpd:
    command: /usr/sbin/snmpd -f -LS0-2d -u Debian-snmp -g Debian-snmp -I -smux,mteTrigger,mteTriggerConf,ifTable,ifXTable,inetCidrRouteTable,ipCidrRouteTable,ip,disk_hw -p /run/snmpd.pid
    override: replace
  snmp-subagent:
    command: python3 -m sonic_ax_impl
    override: replace

parts:
  setup-snmp:
    plugin: dump
    source: .
    build-packages:
      - unzip
    override-build: |
      craftctl default

      # Install SONiC debs (wildcard filenames)
      dpkg -x debs/socat_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libnl-3-200_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libnl-genl-3-200_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libnl-route-3-200_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libnl-nf-3-200_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libnl-cli-3-200_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libswsscommon_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libyang3_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/python3-libyang_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/python3-swsscommon_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/sonic-db-cli_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/sonic-eventd_*.deb ${CRAFT_PART_INSTALL}

      # Equiv of build-time "python3 -m sonic_ax_impl install": place the
      # sysDescr pass-through script where snmpd.conf (line ~213) expects it.
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/snmp
      unzip -p python-wheels/asyncsnmp-2.1.0-py3-none-any.whl sonic_ax_impl/bin/sysDescr_pass.py > ${CRAFT_PART_INSTALL}/usr/share/snmp/sysDescr_pass.py
      chmod +x ${CRAFT_PART_INSTALL}/usr/share/snmp/sysDescr_pass.py

      # Clean up deb/wheel source files
      rm -rf ${CRAFT_PART_INSTALL}/debs ${CRAFT_PART_INSTALL}/python-wheels

    organize:
      start.sh: usr/bin/start.sh
      snmp_yml_to_configdb.py: usr/bin/snmp_yml_to_configdb.py
      snmpd.conf.j2: usr/share/sonic/templates/snmpd.conf.j2
      sysDescription.j2: usr/share/sonic/templates/sysDescription.j2
      files/syslog-layer.yaml: usr/share/sonic/templates/syslog-layer.yaml
      files/swss_vars.j2: usr/share/sonic/templates/swss_vars.j2
      files/readiness_probe.sh: usr/bin/readiness_probe.sh
      files/container_startup.py: usr/share/sonic/scripts/container_startup.py

    stage-packages:
      # Base runtime packages (inherited from config-engine layer)
      - rsyslog
      - rsyslog-relp
      - python3
      - redis-tools
      - iproute2
      - net-tools
      - jq
      - libzmq5
      - libwrap0
      - libatomic1
      - libdaemon0
      - libdbus-1-3
      - libjansson4
      - python3-redis
      - python3-yaml
      - python3-cffi-backend
      # SONiC deb runtime dependencies
      - libboost-serialization1.83.0
      - libhiredis1.1.0
      - libuuid1
      - libxxhash0
      - libpython3.14
      # snmp-specific runtime packages
      - snmp
      - snmpd
      - ipmitool

    override-prime: |
      craftctl default

      cp ${CRAFT_PROJECT_DIR}/files/rsyslog.conf etc/rsyslog.conf
      cp ${CRAFT_PROJECT_DIR}/manifest.json manifest.json
      cp ${CRAFT_PROJECT_DIR}/envs usr/share/sonic/templates/

  install-python:
    plugin: python
    source: .
    build-packages:
      - python3-dev
      - gcc
      - make
    python-packages:
      # config-engine inherited SONiC wheels
      - ./python-wheels/sonic_py_common-1.0-py3-none-any.whl
      - ./python-wheels/sonic_yang_mgmt-1.0-py3-none-any.whl
      - ./python-wheels/sonic_yang_models-1.0-py3-none-any.whl
      - ./python-wheels/sonic_containercfgd-1.0-py3-none-any.whl
      - ./python-wheels/sonic_config_engine-1.0-py3-none-any.whl
      # container-specific SONiC wheels
      - ./python-wheels/sonic_platform_common-1.0-py3-none-any.whl
      - ./python-wheels/asyncsnmp-2.1.0-py3-none-any.whl
      # common pip packages
      - jinjanator
      - click
      - pyangbind==0.8.7
      - lxml
      # snmp-specific pip packages
      - hiredis
      - pyyaml
      - smbus
    stage-packages:
      - python3-venv

  add-user:
    plugin: nil
    after: [setup-snmp]
    overlay-script: |
      groupadd -R $CRAFT_OVERLAY syslog
      useradd -R $CRAFT_OVERLAY -M -r --system -g adm syslog

      groupadd -R $CRAFT_OVERLAY Debian-snmp
      useradd -R $CRAFT_OVERLAY -M -r --system -g Debian-snmp Debian-snmp
    prime:
      - etc/passwd
      - etc/group