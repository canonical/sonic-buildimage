# Removed dependencies and why: see sonic-buildimage 202605_resolute_doc docs/superpowers/data/2026-11-11-batch1-deps/REMOVALS-zh.md
name: docker-database
summary: SONiC database container
description: A Chiselled rock for SONiC database container
version: "1.0.0"

base: bare
build-base: ubuntu@26.04
license: Apache-2.0

platforms:
  amd64:

services:
  rsyslogd:
    command: /usr/sbin/rsyslogd -n -iNONE
    override: replace
    startup: enabled
  proc-exit-listener:
    command: /usr/bin/supervisor-proc-exit-listener-rs --pebble
    override: replace
    startup: enabled
    on-success: ignore
    requires: [rsyslogd]
    after: [rsyslogd]
  init:
    command: docker-database-init.sh
    override: replace
    startup: enabled
    on-success: ignore
    environment:
      # Dockerfile.j2 bakes the build flag in; the rock build assumes its default
      INCLUDE_SYSTEM_EVENTD: "y"
  redis:
    command: bash -c "{ [[ -s /var/lib/redis/dump.rdb ]] || rm -f /var/lib/redis/dump.rdb; } && mkdir -p /var/lib/redis && exec /usr/bin/redis-server /etc/redis/redis.conf --bind 127.0.0.1 --port 6379 --unixsocket /var/run/redis/redis.sock --pidfile /var/run/redis/redis.pid --dir /var/lib/redis"
    override: replace
    user: redis
    group: redis
    on-success: ignore
    on-failure: shutdown
  redis_bmp:
    command: bash -c "{ [[ -s /var/lib/redis_bmp/dump.rdb ]] || rm -f /var/lib/redis_bmp/dump.rdb; } && mkdir -p /var/lib/redis_bmp && exec /usr/bin/redis-server /etc/redis/redis.conf --bind 127.0.0.1 --port 6400 --unixsocket /var/run/redis/redis_bmp.sock --pidfile /var/run/redis/redis_bmp.pid --dir /var/lib/redis_bmp"
    override: replace
    user: redis
    group: redis
    on-success: ignore
    on-failure: shutdown
  flushdb:
    command: bash -c "sleep 300 && /usr/local/bin/flush_unused_database"
    override: replace
    on-success: ignore
    on-failure: ignore

parts:
  # INTERIM: Ubuntu slices are cut from jy5275/chisel-releases@sonic-26.04
  # (upstream ubuntu-26.04 + pending PRs) because these slices are not upstream yet:
  #   rsyslog, rsyslog-relp, libestr0, libfastjson4, librelp0  <- canonical/chisel-releases#1104
  #   python3-cffi-backend                                     <- canonical/chisel-releases#1509
  # Once ALL PRs above are merged into canonical/chisel-releases ubuntu-26.04:
  #   1. delete this `slices-interim` part
  #   2. uncomment the `ubuntu-slices` part below (same slice list)
  #   3. drop `slices-interim` from any `after:` list
  slices-interim:
    plugin: nil
    source: https://github.com/jy5275/chisel-releases.git
    source-type: git
    source-branch: sonic-26.04
    source-depth: 1
    override-build: |
      chisel cut --release ./ --root ${CRAFT_PART_INSTALL} \
        base-files_base \
        base-files_chisel \
        base-files_release-info \
        base-passwd_data \
        bash_bins \
        coreutils_cat \
        coreutils_chown \
        coreutils_cp-bin \
        coreutils_cut \
        coreutils_echo \
        coreutils_env \
        coreutils_expr \
        coreutils_head \
        coreutils_mkdir \
        coreutils_rm-bin \
        coreutils_sleep \
        coreutils_touch \
        coreutils_tr-bin \
        gawk_bins \
        iproute2_config \
        iproute2_ip-bin \
        jq_bins \
        libboost-serialization1.83.0_libs \
        libhiredis1.1.0_libs \
        libnl-nf-3-200_libs \
        libpython3.14_libs \
        libpython3.14-stdlib_data-types \
        libpython3.14-stdlib_internet \
        libpython3.14-stdlib_zstd \
        libxxhash0_libs \
        libzmq5_libs \
        openssl_config \
        procps_bins \
        python3-cffi-backend_libs \
        redis-server_bins \
        rsyslog_bins \
        rsyslog-relp_modules \
        sed_bins
    stage:
      # Debian's apport hook (apport is not in the rock); install-python ships the sitecustomize.py
      # that adds its site-packages
      - -usr/lib/python3.14/sitecustomize.py

  # ubuntu-slices:
  #   plugin: nil
  #   stage-slices:
  #     - base-files_base
  #     - base-files_chisel
  #     - base-files_release-info
  #     - base-passwd_data
  #     - bash_bins
  #     - coreutils_cat
  #     - coreutils_chown
  #     - coreutils_cp-bin
  #     - coreutils_cut
  #     - coreutils_echo
  #     - coreutils_env
  #     - coreutils_expr
  #     - coreutils_head
  #     - coreutils_mkdir
  #     - coreutils_rm-bin
  #     - coreutils_sleep
  #     - coreutils_touch
  #     - coreutils_tr-bin
  #     - gawk_bins
  #     - iproute2_config
  #     - iproute2_ip-bin
  #     - jq_bins
  #     - libboost-serialization1.83.0_libs
  #     - libhiredis1.1.0_libs
  #     - libnl-nf-3-200_libs
  #     - libpython3.14_libs
  #     - libpython3.14-stdlib_data-types
  #     - libpython3.14-stdlib_internet
  #     - libpython3.14-stdlib_zstd
  #     - libxxhash0_libs
  #     - libzmq5_libs
  #     - openssl_config
  #     - procps_bins
  #     - python3-cffi-backend_libs
  #     - redis-server_bins
  #     - rsyslog_bins
  #     - rsyslog-relp_modules
  #     - sed_bins
  #   stage:
  #     - -usr/lib/python3.14/sitecustomize.py

  sonic-debs:
    plugin: nil
    source: debs
    override-build: |
      dpkg -x libswsscommon_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x sonic-supervisord-utilities-rs_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x libyang3_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x python3-libyang_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x python3-swsscommon_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x sonic-db-cli_*.deb ${CRAFT_PART_INSTALL}
    organize:
      # base-files_var makes /var/run a symlink to /run; libswsscommon ships a real var/run/
      var/run/redis: run/redis
    stage:
      - -var/run
      - -usr/share/doc
      - -usr/share/man

  setup-database:
    plugin: dump
    source: .
    after: [slices-interim, sonic-debs]
    organize:
      database_config.json.j2: usr/share/sonic/templates/database_config.json.j2
      database_global.json.j2: usr/share/sonic/templates/database_global.json.j2
      multi_database_config.json.j2: usr/share/sonic/templates/multi_database_config.json.j2
      critical_processes.j2: usr/share/sonic/templates/critical_processes.j2
      files/syslog-layer.yaml: usr/share/sonic/templates/
      docker-database-init.sh: usr/local/bin/docker-database-init.sh
      files/container_startup.py: usr/share/sonic/scripts/container_startup.py
      files/readiness_probe.sh: usr/bin/readiness_probe.sh
      files/swss_vars.j2: usr/share/sonic/templates/swss_vars.j2
      files/90-sonic.conf: usr/lib/sysctl.d/90-sonic.conf
      files/update_chassisdb_config: usr/local/bin/update_chassisdb_config
      flush_unused_database: usr/local/bin/flush_unused_database
    stage:
      - usr/
    override-prime: |
      craftctl default

      # Make update script executable
      chmod +x usr/local/bin/update_chassisdb_config

      # Replace the rsyslog_config slice's /etc/rsyslog.conf with SONiC's; done at prime so the slice copy cannot win
      cp ${CRAFT_PROJECT_DIR}/files/rsyslog.conf etc/rsyslog.conf

      # Configure redis settings (same sed as Dockerfile.j2)
      sed -ri 's/^# save ""$/save ""/g; s/^daemonize yes$/daemonize no/; s/^logfile .*$/logfile ""/; s/^# syslog-enabled no$/syslog-enabled no/; s/^# unixsocket/unixsocket/; s/redis-server.sock/redis.sock/g; s/^client-output-buffer-limit pubsub [0-9]+mb [0-9]+mb [0-9]+/client-output-buffer-limit pubsub 0 0 0/; s/^notify-keyspace-events ""$/notify-keyspace-events AKE/; s/^databases [0-9]+$/databases 100/' etc/redis/redis.conf

      # redis-server runs as redis, which nothing staged creates; pin uid/gid 999 as in the previous image
      groupadd -R ${CRAFT_PRIME} -r -g 999 redis
      useradd -R ${CRAFT_PRIME} -M -r -u 999 -g redis -d /var/lib/redis -s /usr/sbin/nologin redis
      rm -f etc/passwd- etc/group- etc/shadow- etc/gshadow- etc/.pwd.lock
      # The host docker cp's the warm-boot dump.rdb here before start; docker-database-init.sh chowns it to redis
      install -d -m 0750 var/lib/redis

      # Copy manifest to root
      cp ${CRAFT_PROJECT_DIR}/manifest.json .

  # Build-time only: pip re-executes itself under the staged interpreter and imports stdlib modules
  # (colorsys, ...) the runtime slices leave out. Stage a fuller stdlib for that, prime none of it.
  pip-interpreter:
    plugin: nil
    source: https://github.com/jy5275/chisel-releases.git
    source-type: git
    source-branch: sonic-26.04
    source-depth: 1
    override-build: |
      chisel cut --release ./ --root ${CRAFT_PART_INSTALL} python3.14_standard python3-minimal_python3
    stage:
      # install-python writes its own sitecustomize.py (adds its site-packages)
      - -usr/lib/python3.14/sitecustomize.py
    prime:
      - -*

  install-python:
    plugin: python
    source: .
    # The python plugin (v2) refuses the build host's interpreter and runs pip under the staged one
    after: [slices-interim, pip-interpreter]
    build-packages:
      - python3-pip
    python-packages:
      - ./python-wheels/sonic_py_common-1.0-py3-none-any.whl
      - ./python-wheels/sonic_yang_mgmt-1.0-py3-none-any.whl
      - ./python-wheels/sonic_yang_models-1.0-py3-none-any.whl
      - ./python-wheels/sonic_containercfgd-1.0-py3-none-any.whl
      - ./python-wheels/sonic_config_engine-1.0-py3-none-any.whl
      - jinjanator
      - click
      - pyangbind==0.8.7
      - lxml
    organize:
      yang-models: usr/local/yang-models
      cvlyang-models: usr/local/cvlyang-models
