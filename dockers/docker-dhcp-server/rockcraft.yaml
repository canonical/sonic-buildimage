name: docker-dhcp-server
summary: SONiC dhcp-server container
description: A rock for SONiC dhcp-server container
version: "1.0.0"

base: ubuntu@26.04
build-base: ubuntu@26.04
license: Apache-2.0

platforms:
  amd64:

services:
  rsyslogd:
    command: /usr/sbin/rsyslogd -n -iNONE
    override: replace
    startup: enabled
  start:
    command: /usr/bin/start.sh
    override: replace
    startup: enabled
    on-success: ignore
    on-failure: ignore
  dhcpservd:
    command: /usr/bin/dhcpservd
    override: replace
    on-success: ignore
    on-failure: shutdown
  kea-dhcp4:
    command: /usr/sbin/kea-dhcp4 -c /etc/kea/kea-dhcp4.conf
    override: replace
    on-success: ignore
    on-failure: shutdown
    environment:
      KEA_PIDFILE_DIR: /tmp/

parts:
  setup-dhcp-server:
    plugin: dump
    source: .
    override-build: |
      craftctl default

      # Install SONiC debs (wildcard filenames)
      dpkg -x debs/socat_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libswsscommon_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libyang3_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/python3-libyang_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/python3-swsscommon_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/sonic-db-cli_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/sonic-eventd_*.deb ${CRAFT_PART_INSTALL}

      # lease_update.sh is not executable in git; docker_init.sh chmod +x'd it
      chmod +x ${CRAFT_PART_INSTALL}/lease_update.sh

      # Clean up deb/wheel source files
      rm -rf ${CRAFT_PART_INSTALL}/debs ${CRAFT_PART_INSTALL}/python-wheels

    organize:
      start.sh: usr/bin/start.sh
      wait_for_dhcpservd.sh: usr/bin/wait_for_dhcpservd.sh
      kea-dhcp4.conf.j2: usr/share/sonic/templates/kea-dhcp4.conf.j2
      lease_update.sh: usr/share/kea/scripts/lease_update.sh
      files/syslog-layer.yaml: usr/share/sonic/templates/syslog-layer.yaml
      files/swss_vars.j2: usr/share/sonic/templates/swss_vars.j2
      files/readiness_probe.sh: usr/bin/readiness_probe.sh
      files/container_startup.py: usr/share/sonic/scripts/container_startup.py

    stage-packages:
      # Base runtime packages (inherited from config-engine layer)
      - rsyslog
      - rsyslog-relp
      - python3
      - redis-tools
      - iproute2
      - net-tools
      - jq
      - libzmq5
      - libwrap0
      - libdaemon0
      - libdbus-1-3
      - libjansson4
      - python3-redis
      - python3-yaml
      - python3-cffi-backend
      # SONiC deb runtime dependencies
      - libboost-serialization1.83.0
      - libhiredis1.1.0
      - libxxhash0
      # libnl-3/genl/route/nf come along as hard Depends of libnl-cli-3-200
      - libnl-cli-3-200
      - libpython3.14
      # dhcp-server-specific runtime packages (kea-common, with the
      # libdhcp_run_script.so hook, comes along as a hard Depends)
      - kea-dhcp4-server
      - tcpdump

    prime:
      # Exclude unnecessary artifacts that `source: .` dumps at the rock root
      - -files
      - -envs
      - -python-debs
      - -vcache
      - -base_image_files
      - -buildinfo
      - -cli-plugin-tests
      - -kea-dhcp4-init.conf
      - -Dockerfile*
      # Docker/supervisord-path only
      - -docker_init.sh
      - -supervisord.conf
      - -critical_processes

    override-prime: |
      craftctl default

      cp ${CRAFT_PROJECT_DIR}/files/rsyslog.conf etc/rsyslog.conf
      cp ${CRAFT_PROJECT_DIR}/manifest.json manifest.json
      # kea-dhcp4-server stage-package ships a default config here (organize cannot overwrite it)
      cp ${CRAFT_PROJECT_DIR}/kea-dhcp4-init.conf etc/kea/kea-dhcp4.conf
      cp ${CRAFT_PROJECT_DIR}/envs usr/share/sonic/templates/

  install-python:
    plugin: python
    source: .
    python-packages:
      # config-engine inherited SONiC wheels
      - ./python-wheels/sonic_py_common-1.0-py3-none-any.whl
      - ./python-wheels/sonic_yang_mgmt-1.0-py3-none-any.whl
      - ./python-wheels/sonic_yang_models-1.0-py3-none-any.whl
      - ./python-wheels/sonic_containercfgd-1.0-py3-none-any.whl
      - ./python-wheels/sonic_config_engine-1.0-py3-none-any.whl
      # container-specific SONiC wheels (provides dhcpservd)
      - ./python-wheels/sonic_dhcp_utilities-1.0-py3-none-any.whl
      # common pip packages
      - jinjanator
      - click
      - pyangbind==0.8.7
      - lxml
      - psutil
    stage-packages:
      - python3-venv
    organize:
      yang-models: usr/local/yang-models
      cvlyang-models: usr/local/cvlyang-models

  add-user:
    plugin: nil
    after: [setup-dhcp-server]
    overlay-script: |
      groupadd -R $CRAFT_OVERLAY syslog
      useradd -R $CRAFT_OVERLAY -M -r --system -g adm syslog
    prime:
      - etc/passwd
      - etc/group
