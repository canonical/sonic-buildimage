name: docker-syncd-brcm
summary: SONiC Broadcom syncd container
description: A rock for SONiC Broadcom syncd container
version: "1.0.0"

base: ubuntu@26.04
build-base: ubuntu@26.04
license: Apache-2.0

platforms:
  amd64:

services:
  rsyslogd:
    command: /usr/sbin/rsyslogd -n -iNONE
    override: replace
    startup: enabled
  start:
    command: /usr/bin/start.sh
    override: replace
    startup: enabled
    on-success: ignore
    on-failure: ignore
  syncd:
    command: /usr/bin/syncd_start.sh
    override: replace
    # supervisord autorestart=false: the host syncd.sh stop path asks syncd to
    # exit (syncd_request_shutdown) and waits for it to go away, so it must not
    # be restarted
    on-success: ignore
    on-failure: ignore
  ledinit:
    command: /usr/bin/start_led.sh
    override: replace
    on-success: ignore
    on-failure: ignore

parts:
  setup-syncd-brcm:
    plugin: dump
    source: .
    override-build: |
      craftctl default

      # Install SONiC debs (wildcard filenames)
      dpkg -x debs/socat_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libswsscommon_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libyang3_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/python3-libyang_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/python3-swsscommon_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/sonic-db-cli_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/sonic-eventd_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libsairedis_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libsaimetadata_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/libsaibcm_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/syncd_*.deb ${CRAFT_PART_INSTALL}
      dpkg -x debs/sswsyncd_*.deb ${CRAFT_PART_INSTALL}

      # Dockerfile.j2: chmod +x /usr/bin/rdb-cli
      chmod +x ${CRAFT_PART_INSTALL}/files/rdb-cli

      # Clean up deb/wheel source files
      rm -rf ${CRAFT_PART_INSTALL}/debs ${CRAFT_PART_INSTALL}/python-wheels

    organize:
      start.sh: usr/bin/start.sh
      start_led.sh: usr/bin/start_led.sh
      bcmsh: usr/bin/bcmsh
      files/rdb-cli: usr/bin/rdb-cli
      files/syslog-layer.yaml: usr/share/sonic/templates/syslog-layer.yaml
      files/swss_vars.j2: usr/share/sonic/templates/swss_vars.j2
      files/readiness_probe.sh: usr/bin/readiness_probe.sh
      files/container_startup.py: usr/share/sonic/scripts/container_startup.py

    stage-packages:
      # Base runtime packages (inherited from config-engine layer)
      - rsyslog
      - rsyslog-relp
      - python3
      - redis-tools
      - iproute2
      - net-tools
      - jq
      - libzmq5
      - libwrap0
      - libdaemon0
      - libdbus-1-3
      - libjansson4
      - python3-redis
      - python3-yaml
      - python3-cffi-backend
      # SONiC deb runtime dependencies
      - libboost-serialization1.83.0
      - libhiredis1.1.0
      - libxxhash0
      # libnl-3/genl/route/nf come along as hard Depends of libnl-cli-3-200
      - libnl-cli-3-200
      # python3-swsscommon's _swsscommon.so links libpython3.14 (sonic-cfggen)
      - libpython3.14
      # libsaibcm Depends (libyaml-0-2 comes along with python3-yaml)
      - libprotobuf32t64
      - lz4
      # syncd-brcm-specific runtime dependencies (Dockerfile.j2 apt-get install)
      - kmod
      - ethtool

    prime:
      # Exclude unnecessary artifacts that `source: .` dumps at the rock root
      - -files
      - -envs
      - -python-debs
      - -vcache
      - -base_image_files
      - -buildinfo
      - -Dockerfile*
      - -supervisord.conf
      - -critical_processes

    override-prime: |
      craftctl default

      cp ${CRAFT_PROJECT_DIR}/files/rsyslog.conf etc/rsyslog.conf
      cp ${CRAFT_PROJECT_DIR}/manifest.json manifest.json

  install-python:
    plugin: python
    source: .
    python-packages:
      # config-engine inherited SONiC wheels
      - ./python-wheels/sonic_py_common-1.0-py3-none-any.whl
      - ./python-wheels/sonic_yang_mgmt-1.0-py3-none-any.whl
      - ./python-wheels/sonic_yang_models-1.0-py3-none-any.whl
      - ./python-wheels/sonic_containercfgd-1.0-py3-none-any.whl
      - ./python-wheels/sonic_config_engine-1.0-py3-none-any.whl
    stage-packages:
      - python3-venv
    organize:
      yang-models: usr/local/yang-models
      cvlyang-models: usr/local/cvlyang-models

  add-user:
    plugin: nil
    after: [setup-syncd-brcm]
    overlay-script: |
      groupadd -R $CRAFT_OVERLAY syslog
      useradd -R $CRAFT_OVERLAY -M -r --system -g adm syslog
    prime:
      - etc/passwd
      - etc/group
