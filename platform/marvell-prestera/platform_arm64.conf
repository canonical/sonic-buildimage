# marvell-prestera arm64 (Asterfusion CX204Y): U-Boot runs GRUB from the ESP
# through bootefi, as the vendor image does. U-Boot's EFI exposes no efivars,
# so GRUB is installed without NVRAM and U-Boot is pointed at it instead.

firmware="uefi"

# The console is the EFI console; GRUB on arm64 has no port-I/O serial
GRUB_SERIAL_COMMAND="# serial console: EFI ConOut"
GRUB_TERMINAL_INPUT="console"
GRUB_TERMINAL_OUTPUT="console"

if [ "$install_env" = "onie" ]; then
    FW_ARG="-f"
    # Refuse before touching the disk if U-Boot's environment is unreachable
    fw_printenv kernel_addr_r > /dev/null 2>&1 || {
        echo "ERROR: Unable to read the U-Boot environment (fw_printenv kernel_addr_r)"
        exit 1
    }
fi

demo_install_uefi_grub()
{
    local demo_mnt="$1"
    local blk_dev="$2"

    local uefi_part=0
    for p in $(seq 8) ; do
        if sgdisk -i $p $blk_dev | grep -q C12A7328-F81F-11D2-BA4B-00A0C93EC93B ; then
            uefi_part=$p
            break
        fi
    done

    [ $uefi_part -eq 0 ] && {
        echo "ERROR: Unable to determine UEFI system partition"
        exit 1
    }

    local esp_dev=$(echo $blk_dev | sed -e 's/\(mmcblk[0-9]\)/\1p/')$uefi_part
    local esp_mnt=$(mktemp -d)
    mount -t vfat $esp_dev $esp_mnt || {
        echo "ERROR: Unable to mount the UEFI system partition $esp_dev"
        exit 1
    }

    grub_install_log=$(mktemp)
    grub-install \
        --no-nvram \
        --bootloader-id="$demo_volume_label" \
        --efi-directory="$esp_mnt" \
        --boot-directory="$demo_mnt" \
        --recheck \
        "$blk_dev" > /$grub_install_log 2>&1 || {
        echo "ERROR: grub-install failed on: $blk_dev"
        cat $grub_install_log && rm -f $grub_install_log
        umount $esp_mnt
        exit 1
    }
    rm -f $grub_install_log

    local grub=$(find $esp_mnt/EFI/$demo_volume_label/ -name 'grub*.efi' -exec basename {} \;)
    umount $esp_mnt
    rmdir $esp_mnt || true
    [ -n "$grub" ] || {
        echo "ERROR: grub-install left no EFI image in EFI/$demo_volume_label"
        exit 1
    }

    # Same variables the vendor image sets, so either OS can be reinstalled over the other
    fw_setenv ${FW_ARG} efi_image "EFI/$demo_volume_label/$grub" &&
    fw_setenv ${FW_ARG} bootefi "fatload mmc 0:$uefi_part \$kernel_addr_r \$efi_image; bootefi \$kernel_addr_r" &&
    fw_setenv ${FW_ARG} bootcmd "run bootefi" || {
        echo "ERROR: Unable to point U-Boot at $grub"
        exit 1
    }
}
