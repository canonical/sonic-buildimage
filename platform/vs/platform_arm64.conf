# vs on arm64 runs on QEMU virt: the firmware's EFI console is the PL011 UART.
# GRUB has no port-I/O serial there, so use the console terminal only.
GRUB_SERIAL_COMMAND="# serial console: EFI ConOut"
GRUB_TERMINAL_INPUT="console"
GRUB_TERMINAL_OUTPUT="console"
GRUB_CMDLINE_LINUX="console=tty0 console=ttyAMA0,115200n8 quiet"
