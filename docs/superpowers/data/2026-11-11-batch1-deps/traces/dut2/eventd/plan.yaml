services:
    eventd:
        override: replace
        command: /usr/bin/eventd
        on-success: ignore
        on-failure: shutdown
    rsyslogd:
        startup: enabled
        override: replace
        command: /usr/sbin/rsyslogd -n -iNONE
    start:
        startup: enabled
        override: replace
        command: /usr/bin/start.sh
        on-success: ignore
        on-failure: ignore
log-targets:
    host-syslog:
        type: syslog
        location: udp://127.0.0.1:514/
        services:
            - all
        override: replace
