# Ubuntu's rsyslog ships dmesg.service as Type=idle with no RemainAfterExit, so after it
# saves /var/log/dmesg it goes inactive and sysmonitor reports the system as not ready.
# oneshot makes its job finish only after the dump exits, so sysmonitor sees the final
# active/exited state instead of a mid-run snapshot.
[Service]
Type=oneshot
RemainAfterExit=yes
